# Sections, in digest order. Keywords match the deal TITLE (whole words).
# relaxed: true = skip price/discount/vote filters (freebies, coupons…). feed_only = filled by feeds above.
categories:
  price_mistake:
    title: "Price Error: Buy Fast"
    emoji: "🚨"
    instant: true                # own message the moment it's found, even overnight (silent)
    relaxed: true                # new posts have few votes — don't wait for them
    max_age_hours: 12            # older ones are almost always dead
    patterns: ['price (?:mistake|error|glitch)', 'pricing (?:mistake|error|glitch)', 'mis-?priced?',
               '\b(?:possible|potential|likely)\s+(?:pm|price)\b', '\bpm\s*\?', '\bprice glitch\b',
               '\bglitch(?:ed)? price\b', '\berror price\b', '\bpe\s*\?']
