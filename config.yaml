# ─────────────────────────────────────────────
#  DealHawk config — edit this, push, done.
# ─────────────────────────────────────────────

timezone: America/Chicago
quiet_hours: [23, 7]          # no pings 11pm–7am
max_alerts_per_run: 8          # anti-spam cap
min_discount_pct: 30           # skip deals under this % off (when % is known)
min_thumbs: 15                 # Slickdeals community score floor (when shown)

# strict   = only send deals the store page CONFIRMS are in stock (fewer, safer)
# balanced = also send ones a store wouldn't let us check, marked ⚠️
stock_policy: strict

trusted_stores: [amazon, best buy, home depot, "lowe's", lowes, costco, "sam's club", walmart,
                 target, "b&h", newegg, woot, micro center, adorama, dell, samsung, ace hardware,
                 rei, nordstrom rack, "levi's", nike, wayfair, ikea, overstock, bed bath & beyond,
                 ashley, article, west elm, pottery barn, crate & barrel, "kohl's", "macy's",
                 hayneedle, christopher knight, frontgate]

feeds:
  - name: Slickdeals Frontpage
    url: https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1
  - name: r/buildapcsales
    url: https://www.reddit.com/r/buildapcsales/new/.rss
  - name: r/frugalmalefashion
    url: https://www.reddit.com/r/frugalmalefashion/new/.rss

# Extra Slickdeals keyword searches (furniture rarely hits the frontpage)
slickdeals_searches: [patio furniture, patio set, outdoor sectional, patio dining set,
                      bed frame, dresser, nightstand, mattress, headboard, bedroom set]

# A deal must match at least one category keyword (whole-word match).
categories:
  patio:
    emoji: "🌿"
    keywords: [patio, outdoor furniture, outdoor sectional, outdoor sofa, conversation set,
               bistro set, adirondack, fire pit, patio umbrella, cantilever umbrella, gazebo,
               pergola, porch swing, outdoor dining, outdoor rug, lounge chair, chaise,
               outdoor loveseat, deck box, wicker]
  bedroom:
    emoji: "🛏️"
    keywords: [bed frame, platform bed, headboard, nightstand, dresser, chest of drawers,
               wardrobe, armoire, bedroom set, mattress, box spring, adjustable base,
               bunk bed, storage bed, upholstered bed, vanity]
  furniture:
    emoji: "🛋️"
    keywords: [standing desk, office chair, herman miller, steelcase, sofa, sectional,
               bookshelf, recliner, accent chair, coffee table]
  electronics:
    emoji: "🔌"
    keywords: [monitor, ssd, nvme, gpu, rtx, radeon, ryzen, intel core, headphones, earbuds,
               airpods, sony wh, bose, ipad, pixel, galaxy, iphone, apple watch, kindle,
               router, mesh, wi-fi 7, nas, soundbar, steam deck, playstation, ps5, xbox,
               nintendo, camera, gopro, dji, power bank, anker, ugreen, keyboard, mouse]
  smart_home:
    emoji: "🏠"
    keywords: [ring, eufy, ecobee, nest, smart lock, august, yale, lutron, philips hue,
               robot vacuum, roborock, roomba, security camera, video doorbell, echo,
               smart plug, thermostat, arlo, wyze, kasa]
  tools_home_improvement:
    emoji: "🛠️"
    keywords: [dewalt, milwaukee, makita, ryobi, ego, kobalt, ridgid, bosch, craftsman,
               drill, impact driver, circular saw, miter saw, pressure washer, leaf blower,
               lawn mower, string trimmer, generator, shop vac, tool set, ladder,
               battery kit, socket set, workbench, air compressor]
  clothing:
    emoji: "👕"
    keywords: [jacket, boots, sneakers, "levi's", jeans, patagonia, "arc'teryx", north face,
               carhartt, adidas, new balance, uniqlo, merino, chinos]

# Words in the TITLE that kill a deal outright.
exclude_keywords: [
  # not interested
  laptop, laptops, notebook, chromebook, macbook, tv, tvs, television, oled tv, qled,
  smart tv, roku, fire tv, google tv,
  # junk
  refurbished, renewed, used, open box, "for parts", kids, "women's", case only,
  screen protector, gift card, credit card]

# Watchlist: alert when one appears at/under max_price (still must pass excludes + stock check).
watchlist:
  - name: Milwaukee M18 combo kit
    keywords: [milwaukee, m18, kit]
    max_price: 250
  - name: 4TB NVMe SSD
    keywords: [4tb, nvme]
    max_price: 230
