# ─────────────────────────────────────────────────────────────
#  DealHawk config. Easiest way to change things: message the bot
#  /help  /add  /block  /watch  /on  /off  /list   (applies next run)
# ─────────────────────────────────────────────────────────────

timezone: America/Chicago
quiet_hours: [23, 7]           # no pings 11pm–7am
max_deals_per_run: 20          # total per digest
per_category: 4                # lines per section (keeps it short)
min_price: 25                  # skip $5 junk
min_discount_pct: 20           # only when the % is known
min_thumbs: 5                  # Slickdeals votes, when shown
max_age_hours: 48              # older deals are usually expired (Slickdeals won't let bots check)

# ✅ = store page confirmed in stock. ⚠️ = store blocks bots, couldn't check.
# balanced = send ✅ + ⚠️ (sold-out/expired always dropped) · strict = ✅ only
stock_policy: balanced

# Fresh, curated sources (tested from GitHub's servers). `category` forces every item into that section.
feeds:
  - {name: Slickdeals Frontpage, url: "https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1"}
  - {name: Slickdeals Popular, url: "https://slickdeals.net/newsearch.php?mode=popdeals&searcharea=deals&searchin=first&rss=1"}
  - {name: DealNews, url: "https://www.dealnews.com/?rss=1", max_age_hours: 96}
  - {name: DealNews Staff Picks, url: "https://www.dealnews.com/f1682/Staff-Pick/?rss=1", max_age_hours: 96}
  - {name: DealNews Electronics, url: "https://www.dealnews.com/c142/Electronics/?rss=1", max_age_hours: 96}
  - {name: DealNews Home & Garden, url: "https://www.dealnews.com/c196/Home-Garden/?rss=1", max_age_hours: 96}
  - {name: Slickdeals New Hot Deals, url: "https://slickdeals.net/newsearch.php?searcharea=deals&searchin=first&rss=1&forumchoice%5B%5D=9"}
  - {name: Slickdeals Freebies, url: "https://slickdeals.net/newsearch.php?searcharea=deals&searchin=first&rss=1&forumchoice%5B%5D=4", category: freebies, max_age_hours: 24}
  - {name: Slickdeals Sweepstakes, url: "https://slickdeals.net/newsearch.php?searcharea=deals&searchin=first&rss=1&forumchoice%5B%5D=25", category: giveaways, max_age_hours: 72}

blocked_stores: [aliexpress, temu, shein, wish, dhgate, banggood]

# Sections, in digest order. Keywords match the deal TITLE (whole words).
# relaxed: true = skip price/discount/vote filters (freebies, coupons…). feed_only = filled by feeds above.
categories:
  price_mistake:
    title: Price Mistake
    emoji: "🚨"
    instant: true                # own message the moment it's found, even overnight (silent)
    relaxed: true                # new posts have few votes — don't wait for them
    max_age_hours: 12            # older ones are almost always dead
    patterns: ['price (?:mistake|error|glitch)', 'pricing (?:mistake|error|glitch)', 'mis-?priced?',
               '\b(?:possible|potential|likely)\s+(?:pm|price)\b', '\bpm\s*\?', '\bprice glitch\b',
               '\bglitch(?:ed)? price\b', '\berror price\b', '\bpe\s*\?']
  ultra:
    title: Ultra Deals
    emoji: "🔥"
    min_pct: 65                  # any deal in your sections at 65%+ off lands here
    keywords: [up to 70% off, up to 75% off,
               up to 80% off, up to 85% off, up to 90% off, clearance]
  wishlist:
    title: Wish List
    emoji: "🎯"
    keywords: [patio set, patio furniture, patio furniture set, outdoor furniture set, patio dining set,
               patio conversation set, conversation set, outdoor sectional, bistro set, wicker set,
               robot vacuum, robot vac, robovac, robot vacuum mop, roomba, roborock, deebot, ecovacs,
               dreame, narwal, self-emptying, self emptying,
               headphones, headphone, earbuds, earbud,
               noise cancelling, noise canceling, quietcomfort, sony wh-1000xm5, sony wh-1000xm6,
               wf-1000xm5, beats, sennheiser, jabra, shokz, galaxy buds, pixel buds,
               plaud, notepin, plaud note, ai voice recorder, ai recorder, ai note taker, ai notetaker,
               soundcore work, ticnote]
  electronics:
    title: Electronics
    emoji: "🔌"
    keywords: [ssd, nvme, gpu, rtx, radeon, ryzen, bose,
               ipad, tablet, apple watch, smartwatch, kindle, router, mesh wifi,
               eero, nas, soundbar, speaker, steam deck, playstation, ps5, xbox, nintendo, switch 2,
               camera, gopro, dji, drone, power station, ecoflow, jackery, power bank, keyboard, mouse,
