# ─────────────────────────────────────────────────────────────
#  DealHawk config. Easiest way to change things: message the bot
#  /help  /add  /block  /watch  /on  /off  /list   (applies next run)
# ─────────────────────────────────────────────────────────────

timezone: America/Chicago
quiet_hours: [23, 7]           # no pings 11pm–7am
max_deals_per_run: 20          # total per digest
per_category: 4                # lines per section (keeps it short)
min_price: 25                  # skip $5 junk
min_discount_pct: 20           # only when the % is known
min_thumbs: 5                  # Slickdeals votes, when shown
max_age_hours: 48              # older deals are usually expired (Slickdeals won't let bots check)

# ✅ = store page confirmed in stock. ⚠️ = store blocks bots, couldn't check.
# balanced = send ✅ + ⚠️ (sold-out/expired always dropped) · strict = ✅ only
stock_policy: balanced
unchecked_price_max_hours: 8   # store hid its price (Amazon does) → only send if the post is this fresh; '~$' marks it
live_price_max_hours: 24       # …but if Slickdeals/DealNews still shows the deal as active, allow up to this age

# 🎯 Wish List + watchlist deals each arrive as their OWN photo card (price, store, age, Buy button),
# and the card rewrites itself to ❌ EXPIRED when the deal dies. Everything else stays in the digest.
wishlist_alerts:
  cards_per_run: 4             # extra wish-list deals in one run ride in the digest instead
  min_thumbs: 2                # a FRESH wish-list post only needs 2 votes (not 5) — you hear sooner
  fresh_hours: 3               # …"fresh" = posted within this many hours; older posts need the usual 5
  track_hours: 36              # how long a sent card keeps getting re-checked for expiry
digest_silent: false

# 🚨 STEALS — a wish-list/watchlist item at a crazy price (Bose $124, Echo Show 8 $56). These sell out in
# about an hour, so they skip everything slow: own loud message, sent first, pinned to the top of the chat,
# ring even during quiet hours, no waiting for votes. Pin comes off automatically when the deal dies.
steal_alerts:
  enabled: true
  min_pct: 50                  # any wish-list item at 50%+ off (when the list price is known) is a steal
  ignore_quiet_hours: true     # false = steals at night arrive silently instead
  pin: true
  # Optional: put steals in their OWN Telegram chat so you can give it a loud custom ringtone.
  # Create a private channel, add @dealscouthawk_bot as admin, save its id as the TELEGRAM_STEAL_CHAT_ID secret.           # true = digest arrives without a buzz, so only 🎯 cards and 🚨 mistakes ping

