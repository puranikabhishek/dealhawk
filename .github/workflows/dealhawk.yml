name: DealHawk

on:
  schedule:
    # Every 30 min (price mistakes vanish fast). ~1,440 of the 2,000 free private-repo minutes/month.
    - cron: "7,37 * * * *"
  workflow_dispatch:      # "Run workflow" button for manual runs
    inputs:
      recheck:
        description: "Re-check deals held as sold-out/unverified"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run save price history + seen deals back to the repo

concurrency:
  group: dealhawk
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hunt deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECHECK: ${{ inputs.recheck }}
        run: python dealhawk.py

      - name: Save state
        run: |
          git config user.name "dealhawk-bot"
          git config user.email "dealhawk-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F_%H%M)"
          git push
