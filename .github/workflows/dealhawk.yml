name: DealHawk

on:
  schedule:
    # Times are UTC. Hourly normally.
    - cron: "7 * * * *"
    # Black Friday week → Cyber Monday (Nov 26 – Dec 2): every 30 min
    - cron: "*/30 * 26-30 11 *"
    - cron: "*/30 * 1-2 12 *"
  workflow_dispatch:      # "Run workflow" button for manual runs
    inputs:
      recheck:
        description: "Re-check deals held as sold-out/unverified"
        type: boolean
        default: false
      probe:
        description: "Test candidate feeds (dev)"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run save price history + seen deals back to the repo

concurrency:
  group: dealhawk
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Probe feeds
        if: ${{ inputs.probe }}
        run: python probe.py

      - name: Hunt deals
        if: ${{ !inputs.probe }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECHECK: ${{ inputs.recheck }}
        run: python dealhawk.py

      - name: Save state
        run: |
          git config user.name "dealhawk-bot"
          git config user.email "dealhawk-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F_%H%M)"
          git push
