name: DealHawk

on:
  # Triggered every 30 min by cron-job.org (GitHub's own scheduler skips runs).
  # ~1,440 of the 2,000 free private-repo minutes/month.
  workflow_dispatch:      # also the "Run workflow" button for manual runs
    inputs:
      recheck:
        description: "Re-check deals held as sold-out/unverified"
        type: boolean
        default: false
      demo:
        description: "Send a sample wish-list card (type: yes — or paste a feed URL)"
        type: string
        default: ""
      dry:
        description: "Dry run: log what would be sent, send nothing"
        type: boolean
        default: false

permissions:
  contents: write   # lets the run save price history + seen deals back to the repo

concurrency:
  group: dealhawk
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hunt deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECHECK: ${{ inputs.recheck }}
          DEMO: ${{ inputs.demo }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ -n "$DEMO" ]; then python dealhawk.py --demo "$( [ "$DEMO" = yes ] && echo all || echo "$DEMO" )"
          elif [ "$DRY" = "true" ]; then python dealhawk.py --dry-run
          else python dealhawk.py; fi

      - name: Save state
        if: ${{ inputs.demo == '' && !inputs.dry }}
        run: |
          git config user.name "dealhawk-bot"
          git config user.email "dealhawk-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "state: $(date -u +%F_%H%M)"
          git push
